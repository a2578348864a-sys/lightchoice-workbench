name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Prepare isolated test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci-test.db"

      - name: Test
        run: npm test
        env:
          DATABASE_URL: "file:./ci-test.db"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          AI_PROVIDER: deepseek
          DEEPSEEK_API_KEY: "sk-placeholder"
          DEEPSEEK_BASE_URL: "https://api.deepseek.com"
          DEEPSEEK_MODEL: "deepseek-chat"
          # taxonomy 运行时数据扩大了 Next 构建图；默认 ~2GB 堆不足以完成 type check。
          NODE_OPTIONS: "--max-old-space-size=4096"
